<!doctype html><html lang="ru"><meta charset="utf-8"><title>iPad landscape layout QA · Архив Нила</title><style>*{box-sizing:border-box}body{margin:0;background:#081f24;color:#e8ddbc;font:14px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#173b3d}select,button{font:inherit;min-height:40px;padding:6px 10px;border:1px solid #927c52;border-radius:6px;background:#254a48;color:#fff}main{padding:14px;display:grid;place-items:start center}#screen{position:relative;border:1px solid #61786c}iframe{border:0;display:block;transform-origin:top left}#metrics{padding:8px 16px;color:#b4ccbd;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style><header><b>iPad · landscape QA</b><label>Экран <select id="device" onchange="changeDevice()"><option value="1080,810">iPad 8/9 · 1080 × 810</option><option value="1024,768">iPad 9.7 · 1024 × 768</option><option value="1180,820">iPad Air 11 · 1180 × 820</option><option value="1133,744">iPad mini 6/7 · 1133 × 744</option><option value="1158,756">iPad mini · 1158 × 756</option><option value="1210,834">iPad Pro 11 · 1210 × 834</option><option value="1366,1024">iPad Air 13 · 1366 × 1024</option><option value="1376,1032">iPad Pro 13 · 1376 × 1032</option><option value="1080,650">iPad 8 · Safari reduced height · 1080 × 650</option><option value="810,1080">Portrait orientation gate · 810 × 1080</option></select></label><label>Экран игры <select id="mode" onchange="changeMode()"><option value="island">Остров</option><option value="build">Строительство</option><option value="scene0">Двор</option><option value="scene1">Библиотека</option><option value="scene2">Храм</option><option value="characters">Персонажи</option><option value="reward">Сюжет / награда</option></select></label><button onclick="report()">Проверить геометрию</button></header><div id="metrics">Запуск…</div><main><div id="screen"><iframe id="game" title="Тестируемый экран игры" src="../index.html?qa=island"></iframe></div></main><script>
const frame=document.querySelector('#game');let w=1080,h=810;
function fit(){let scale=Math.min((innerWidth-32)/w,(innerHeight-130)/h,1);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';document.querySelector('#screen').style.width=w*scale+'px';document.querySelector('#screen').style.height=h*scale+'px'}
function changeDevice(){[w,h]=document.querySelector('#device').value.split(',').map(Number);fit();setTimeout(report,400)}
function changeMode(){frame.src='../index.html?qa='+document.querySelector('#mode').value}
function report(){const d=frame.contentDocument,win=frame.contentWindow;if(!d)return;const c=d.querySelector('canvas'),r=c.getBoundingClientRect();const open=d.querySelector('dialog[open]');document.querySelector('#metrics').textContent=JSON.stringify({viewport:[win.innerWidth,win.innerHeight],body:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],canvasCSS:[Math.round(r.width),Math.round(r.height)],canvasPixels:[c.width,c.height],orientationGate:!d.querySelector('#rotateGate').hidden,dialog:open?.id||null})}
frame.onload=()=>{fit();setTimeout(report,1500)};addEventListener('resize',fit);fit();
</script></html>
