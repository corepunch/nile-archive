name: Relic Rush balance

on: workflow_dispatch

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libegl1-mesa-dev libgl-dev libasound2-dev
      - name: Play every board and fit restoration prices
        run: make -j2 test-balance
      - name: Show balance report
        if: always()
        run: test ! -f build/test/relic-rush.log || cat build/test/relic-rush.log
