name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install platform build and headless display dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libegl1-mesa-dev libgl-dev libasound2-dev xvfb
      - name: Build games
        run: make CFLAGS="-O2 -g -Werror"
      - name: Renderer and platform input tests
        run: xvfb-run -a make test-platform
      - name: Unit tests
        run: make test
      - name: Smoke test (headless screenshot of every screen)
        run: |
          pip install pillow
          xvfb-run -a ./tools/screenshots.sh
      - name: Relic Rush smoke test (level one to level two through injected clicks)
        run: xvfb-run -a timeout 600 ./build/relic-rush --headless --fresh --smoke --mute
      - name: Volcano smoke test (five districts, pause, restart and replay through clicks)
        run: xvfb-run -a timeout 600 ./build/volcano --headless --fresh --smoke --mute --size 456x342
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: games/*/docs/screenshots/

  xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build all games' iOS targets for the Simulator from the committed Xcode projects
        run: |
          for s in nile-archive-ipad relic-rush-iphone volcano-ipad; do
            g=${s%-*}
            xcodebuild -project games/$g/$g.xcodeproj -scheme $s -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build/xcode-$g CODE_SIGNING_ALLOWED=NO build | tail -20
            test "${PIPESTATUS[0]}" -eq 0
          done

      - name: Launch all games and capture frames in iOS Simulator
        run: python3 tools/xcode/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: build/ios-smoke/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Build WebAssembly
        run: make web
      - name: Browser smoke tests (cloud-only browser installation)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/test_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: build/web-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/
