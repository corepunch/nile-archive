name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build games
        run: make CFLAGS="-O2 -g -Werror"
      - name: Unit tests
        run: make test
      - name: Smoke test (headless screenshot of every screen)
        run: |
          pip install pillow
          SDL_AUDIODRIVER=dummy ./tools/screenshots.sh
      - name: Relic Rush smoke test (level one to level two through injected clicks)
        run: SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy timeout 600 ./build/relic-rush --smoke --mute
      - name: Volcano smoke test (five districts, pause, restart and replay through clicks)
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 600 ./build/volcano --fresh --smoke --mute --size 456x342
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: games/*/docs/screenshots/

  xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build all games' iOS targets for the Simulator from the committed Xcode projects
        run: |
          for s in nile-archive-ipad relic-rush-iphone volcano-ipad; do
            g=${s%-*}
            xcodebuild -project games/$g/$g.xcodeproj -scheme $s -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build/xcode-$g CODE_SIGNING_ALLOWED=NO build | tail -20
            test "${PIPESTATUS[0]}" -eq 0
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Build WebAssembly
        run: make web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/
