name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build games
        run: make CFLAGS="-O2 -g -Werror"
      - name: Unit tests
        run: make test
      - name: Smoke test (headless screenshot of every screen)
        run: |
          pip install pillow
          ./tools/screenshots.sh
      - name: Relic Rush bot plays a level through the real game loop
        run: SDL_VIDEODRIVER=offscreen timeout 600 ./build/relic-rush --fresh --size 480x360 --autoplay 1
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: games/*/docs/screenshots/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Build WebAssembly
        run: make web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/
