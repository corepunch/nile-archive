name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install asset and lint tools
        run: |
          sudo apt-get update && sudo apt-get install -y lua-check gettext
          pip install -r tools/requirements-assets.txt
      - name: Validate generated code, projects, artwork and Lua before platform builds
        run: |
          make gen-check xcode-check test-assets lint
          python3 tools/test_run_tests.py
          make test-ios-deploy

  native:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install platform build and headless display dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libx11-dev libegl1-mesa-dev libgl-dev libasound2-dev xvfb
      - name: Build games and native tests
        run: |
          make -j2 CFLAGS="-O2 -g -Werror" all
          make -j2 build/test/all build/test-audio
      - name: Native rules, renderer, audio and quick gameplay smoke tests
        run: xvfb-run -a make test-ci

  xcode:
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build all games' iOS targets for the Simulator from the committed Xcode projects
        run: |
          for s in nile-archive-ipad relic-rush-iphone christmas-market-iphone emergency-ipad; do
            g=${s%-*}
            xcodebuild -project games/$g/$g.xcodeproj -scheme $s -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build/xcode-$g CODE_SIGNING_ALLOWED=NO build | tail -20
            test "${PIPESTATUS[0]}" -eq 0
          done

      - name: Launch all games and capture frames in iOS Simulator
        run: python3 tools/xcode/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: build/ios-smoke/

  web:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Build WebAssembly
        run: make web
      - name: Browser smoke tests (cloud-only browser installation)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/test_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: build/web-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/
